# Sổ bán hàng gốm — triển khai bằng Docker Compose (Coolify)
# - 1 dịch vụ "app": Node vừa chạy API (/api) vừa trả giao diện. Trên Coolify gán domain cho "app" cổng 3000.
# - Chỉ dùng "expose" (không "ports") nên không chiếm cổng của máy chủ.
# - Dữ liệu SQLite + bản sao lưu hằng đêm nằm trong volume "gomsu-data" (/data).
# - Biến môi trường: xem .env.example (trên Coolify nhập ở mục Environment Variables).
services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      TZ: Asia/Ho_Chi_Minh
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      DEMO_MODE: ${DEMO_MODE:-false}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-}
      TRACKING_WEBHOOK_SECRET: ${TRACKING_WEBHOOK_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - gomsu-data:/data

volumes:
  gomsu-data:
