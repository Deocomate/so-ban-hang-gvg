# Phục vụ giao diện (SPA) và chuyển /api sang dịch vụ "api" (tên dịch vụ trong docker-compose)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json font/ttf;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Tệp có mã băm trong tên: lưu đệm lâu dài
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Service worker và trang chính: luôn lấy bản mới
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html {
    add_header Cache-Control "no-cache";
    # add_header trong location thay thế toàn bộ add_header ở server → nhắc lại các header bảo mật
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
